_format_version: "3.0"
plugins:
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      per_consumer: false

consumers:
  - username: edusystem-issuer
    jwt_secrets:
      - key: edusystem-kong
        algorithm: RS256

        secret: unused-for-rs256

        rsa_public_key: |
          __JWT_PUBLIC_KEY_PEM__

services:
  - name: edusystem-backend
    url: https://edusystem-upstream:8443
    tls_verify: true
    tls_verify_depth: 2
    ca_certificates:
      - 71d81c17-dc8a-4b5e-94ed-a8f7a399561f
    routes:
      - name: edusystem-login
        paths:
          - '~/api/auth/login$'
        methods:
          - POST
          - OPTIONS
        regex_priority: 100
        strip_path: false
        protocols:
          - http
          - https
        plugins:
          - name: cors
            config:
              origins:
                - http://localhost:5173
              methods:
                - POST
                - OPTIONS
              headers:
                - Content-Type
                - X-CSRF-TOKEN
                - Accept
              credentials: true
              preflight_continue: false
              max_age: 600
          - name: request-size-limiting
            config:
              allowed_payload_size: 8192
              size_unit: bytes
              require_content_length: false
          - name: rate-limiting
            config:
              limit_by: ip
              minute: 10
              policy: local


          - name: edusystem-jwt-issuer
            config:
              verify_url: https://backend:8443/internal/auth/verify
              issuer: edusystem-kong
              audience: edusystem-api
              ttl_seconds: 600
              private_key_file: /run/secrets/kong_jwt_private_key
              public_key_file: /run/secrets/kong_jwt_public_key
              internal_ca_file: /run/secrets/internal_ca
              internal_api_key_file: /run/secrets/kong_internal_api_key
              verification_timeout_ms: 5000
              max_request_bytes: 8192
              max_response_bytes: 16384
              frontend_origin: http://localhost:5173

      - name: edusystem-auth-entry
        paths:
          - '~/api/auth/register/student$'
        regex_priority: 100
        strip_path: false
        protocols:
          - http
          - https
        plugins:
          - name: rate-limiting
            config:
              limit_by: ip
              minute: 10
              policy: local

      - name: edusystem-auth-csrf
        paths:
          - '~/api/auth/csrf$'
        regex_priority: 100
        strip_path: false
        protocols:
          - http
          - https
        plugins:
          - name: rate-limiting
            config:
              limit_by: ip
              minute: 60
              policy: local

      - name: edusystem-api
        paths:
          - /api
        strip_path: false
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
                - nbf
              header_names:
                - authorization
              uri_param_names: [ ]
              cookie_names: [ ]
              run_on_preflight: false
              maximum_expiration: 600


          - name: proxy-cache
            config:
              strategy: memory
              request_method: [GET]
              response_code: [200]
              content_type: [application/json]
              cache_ttl: 30
              storage_ttl: 30
              cache_control: false
              vary_headers:
                - authorization


          - name: rate-limiting
            config:
              limit_by: ip
              minute: 120
              policy: local

upstreams:
  - name: edusystem-upstream
    algorithm: round-robin
    targets:
      - target: backend:8443
        weight: 100

ca_certificates:
  - id: 71d81c17-dc8a-4b5e-94ed-a8f7a399561f
    cert: |
      __INTERNAL_CA_PEM__
