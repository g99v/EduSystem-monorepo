global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: kong
    metrics_path: /metrics
    fallback_scrape_protocol: PrometheusText0.0.4
    scrape_timeout: 5s
    static_configs:
      - targets: ["kong:8100"]

  - job_name: jwt-issuer
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets: ["kong:9464"]
